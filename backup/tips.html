<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tips | Carbon Tracker</title>
  <link rel="stylesheet" href="sty_tips.css">
</head>

<body onload="checkLogin(); generateTips()">

  <header class="top-header">
    <div>
      <h1>🌱 Personalized Tips</h1>
      <p>Small changes for a better planet</p>
    </div>

    <div class="user-box">
      <p><b>Logged in as:</b> <span id="user"></span></p>
      <div class="button-container">
        <button onclick="window.location.href='history.html'" class="history-btn">History</button>
        <button onclick="window.location.href='index.html'" class="home-btn" style="background: linear-gradient(to right, #284e0f, #3b9661);">Home</button>
        <button onclick="logout()" class="logout-btn">Logout</button>
      </div>
    </div>
  </header>

  <div class="container">
    <h2 id="tipHeading">Analyzing your footprint...</h2>
    
    <div id="tipsContainer">
        </div>

    <hr>
    <h3>🌍 Global Impact Tip</h3>
    <p>Did you know? If everyone lived like the average person in high-income countries, we would need 4 Earths to sustain our resources.</p>
  </div>

  <footer>
    <p>© 2025 Carbon Tracker | 🌱 Tracked by <span id="userNameFooter"></span></p>
  </footer>

  <script src="script.js"></script>
  <script>
    // Header & Footer User Details
    document.getElementById("user").innerText = localStorage.getItem("userEmail") || "Guest";
    document.getElementById("userNameFooter").innerText = localStorage.getItem("userName") || "";
  </script>

</body>
</html>
