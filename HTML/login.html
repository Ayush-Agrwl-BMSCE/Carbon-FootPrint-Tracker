<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Carbon Tracker</title>
  <link rel="stylesheet" href="sty_log.css">
</head>
<body class="login-body">

  <!--LOGIN HEADER -->
  <header class="top-header">
    <h1>🌍 Carbon Footprint Tracker</h1>
    <p>Join us and start saving the planet</p>
    <div class="user-box" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%);">
            <button onclick="window.location.href='signup.html'" class="signup-btn">Sign Up</button>
        </div>
  </header>

  <!--LOGIN BOX -->
  <div class="login-box"> <form>
    <h1>User Login</h1>
  
    <label>Email</label>
    <input type="text" id="email" placeholder="Enter Email" required>

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">

    <button type="submit" onclick="login(event)">Login</button>

    <p id="error"></p>
    </form>
  </div>

  <footer>
    <p>© 2025 Carbon Tracker | 🌱</p>
  </footer>

  <script src="script.js"></script>
  <script>
        document.getElementById("userNameFooter").innerText = localStorage.getItem("userName") || "Guest";
    </script>
</body>
</html>
