<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up | Carbon Tracker</title>
    <link rel="stylesheet" href="sty_signup.css">
</head>

<body class="signup-body">

    <header class="top-header">
        <h1>🌍 Carbon Footprint Tracker</h1>
        <p>Join us and start saving the planet</p>
        <div class="user-box" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%);">
            <button onclick="window.location.href='login.html'" class="login-btn">Login</button>
        </div>
    </header>

    <div class="signup-box">
        <form id="signupForm">
            <h1>Create Account</h1>

            <label>Username</label>
            <input type="text" id="signupName" placeholder="Enter UserName" required>

            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="Enter Email" required>

            <label>Phone Number</label>
            <input type="tel" id="signupPhone" placeholder="Enter phone number" required>

            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Create a password" required>

            <button type="button" onclick="handleSignup()">Sign Up</button>

            <p id="error" style="color: #ff5f5f; margin-top: 10px;"></p>
        </form>
    </div>
    <footer>
        <p>© 2025 Carbon Tracker | 🌱 </p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
